version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: marketplace_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/marketplace_db
      - JWT_SECRET=marketplace_secret_jwt_key_2026
    depends_on:
      - mongodb

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: marketplace_admin_panel
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend

  mobile-app:
    build:
      context: ./mobile-app
      dockerfile: Dockerfile
    container_name: marketplace_mobile_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
